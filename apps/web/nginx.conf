# SPA + проксирование /api на api-контейнер.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # статика SPA: всё неизвестное → index.html (клиентский роутинг)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Оболочка, воркер и манифест — БЕЗ кеша (AR-185). У них имена без хеша, и
  # молчание про Cache-Control включало эвристическую свежесть браузера
  # (~10% от возраста файла): ревалидация возвращала ту же старую разметку, и
  # релиз не доезжал до устройства часами. `no-cache` — не «не хранить», а
  # «спроси перед показом»: ETag сохраняет 304 и трафик.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # API → NestJS
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m; # base64-аудио для голосового ввода
  }

  # Кеш статики с хешами: имя файла несёт хеш содержимого, значит ответ
  # неизменен по построению. Заголовок ОДИН: `expires 1y` сам порождает
  # `Cache-Control: max-age=31536000`, и вместе с соседним `add_header` они
  # склеивались в двойной Cache-Control на самом чувствительном маршруте.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
