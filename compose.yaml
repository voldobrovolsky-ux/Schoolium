name: schoolium

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schoolium
      POSTGRES_USER: schoolium
      POSTGRES_PASSWORD: schoolium-dev-only
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolium -d schoolium"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["node", "dist/infrastructure/migrate.js"]
    environment:
      DATABASE_URL: postgresql://schoolium:schoolium-dev-only@postgres:5432/schoolium
    depends_on:
      postgres:
        condition: service_healthy

  idp:
    build: .
    command: ["node", "dist/idp/server.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://schoolium:schoolium-dev-only@postgres:5432/schoolium
      REDIS_URL: redis://redis:6379
      IDP_ISSUER: http://localhost:4000
      SCHOOLIUM_REDIRECT_URI: http://localhost:3000/auth/callback
    ports: ["4000:4000", "4001:4001"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  schoolium:
    build: .
    command: ["node", "dist/schoolium/server.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://schoolium:schoolium-dev-only@postgres:5432/schoolium
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
