name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --requirement requirements-docs.txt
      - run: python scripts/validate_docs.py
      - run: mkdocs build --strict

# Enable `python scripts/validate_docs.py --strict` as a required release gate only
# after the decisions in docs/risks.md have Accepted ADRs.
