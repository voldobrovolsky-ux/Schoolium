# EduStore — хостовый nginx (вариант А, см. docs/DEPLOY.md).
# Терминирует TLS и проксирует на стек docker-compose.prod.yml, опубликованный на 127.0.0.1.
#
# Установка:
#   sudo cp deploy/nginx/edustore.conf /etc/nginx/sites-available/edustore.conf
#   sudo ln -s /etc/nginx/sites-available/edustore.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d edustore-flor-group.ru     # выпустит/пропишет сертификат
#   sudo nginx -t && sudo systemctl reload nginx
#
# Рекомендуемая схема: ОДИН upstream на web-контейнер (127.0.0.1:8080) — он сам отдаёт
# SPA и проксирует /api → api:3000 со всеми нужными заголовками (apps/web/nginx.conf).

upstream edustore_web { server 127.0.0.1:8080; }   # web-контейнер (SPA + /api)
# upstream edustore_api { server 127.0.0.1:3000; }  # api напрямую (если делите /api и /)

server {
  listen 80;
  listen [::]:80;
  server_name edustore-flor-group.ru;
  # certbot подставит редирект на 443 сам; до выпуска сертификата можно проксировать здесь же.
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name edustore-flor-group.ru;

  # Сертификат (certbot --nginx пропишет эти строки автоматически):
  ssl_certificate     /etc/letsencrypt/live/edustore-flor-group.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/edustore-flor-group.ru/privkey.pem;

  client_max_body_size 25m;   # base64-аудио голосового ввода

  # Всё (SPA + /api) → web-контейнер. httpOnly-cookie сессии Флёруса проходят как есть.
  location / {
    proxy_pass http://edustore_web;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # API строит https-редиректы/Secure-cookie
  }

  # ── Альтернатива: делить трафик, /api напрямую в api (без web-контейнера). ──
  # Тогда опубликуйте только api (127.0.0.1:3000) и раздавайте SPA как-то иначе.
  # ВАЖНО: без слэша в proxy_pass, чтобы сохранить префикс /api (глобальный prefix NestJS):
  # location /api/ {
  #   proxy_pass http://edustore_api;          # НЕ http://edustore_api/  — иначе /api срежется → 404
  #   proxy_http_version 1.1;
  #   proxy_set_header Host              $host;
  #   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto https;
  #   client_max_body_size 25m;
  # }
}
